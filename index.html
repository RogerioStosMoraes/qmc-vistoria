<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E5676">
<title>QMC Vistoria</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top" id="top"></header>
<main id="view"></main>
<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h3 id="dlgTitle"></h3>
    <input id="dlgInput" type="text" autocomplete="off">
    <div class="dlg-actions">
      <button value="cancel" class="btn ghost">Cancelar</button>
      <button value="ok" class="btn primary" id="dlgOk">OK</button>
    </div>
  </form>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="vendor/jszip.min.js"></script>
<script src="vendor/msal-browser.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
